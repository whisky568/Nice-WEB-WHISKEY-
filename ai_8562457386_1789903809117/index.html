<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صورة ويسكي</title>
    <style>
        /* 
        *   تأثير خلفية الخضراء
        */
        body {
            background-image: linear-gradient(to bottom, #32CD32, #008000);
            background-size: 100% 200px;
            background-position: 0 100%;
            animation: move 5s linear infinite;
        }
        @keyframes move {
            0% { background-position: 0 100%; }
            100% { background-position: 0 0; }
        }

        /* 
        *   التصميم الرئيسي
        */
        .character {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        .character img {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: 2px solid black;
            box-shadow: 0 0 10px black;
        }
        .character .eyes {
            position: relative;
            width: 100px;
            height: 50px;
            top: 70px;
            left: 50px;
        }
        .character .eyes .eye {
            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: blue;
        }
        .character .eyes .left-eye {
            left: 0;
        }
        .character .eyes .right-eye {
            right: 0;
        }
        .character .mouth {
            position: relative;
            width: 50px;
            height: 20px;
            top: 120px;
            left: 50px;
            border-radius: 50%;
            background-color: black;
        }
        .character .whiskey {
            position: absolute;
            top: 150px;
            left: 50px;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: #FFD700;
        }
        .character .bottle {
            position: absolute;
            top: 200px;
            left: 50px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: #FF0000;
        }
        .character .arms {
            position: absolute;
            top: 120px;
            left: 50px;
        }
        .character .arm.left {
            transform: rotate(45deg);
            left: 0;
        }
        .character .arm.right {
            transform: rotate(-45deg);
            right: 0;
        }
        .character .legs {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
        }
        .character .leg.left {
            transform: rotate(45deg);
            left: 0;
        }
        .character .leg.right {
            transform: rotate(-45deg);
            right: 0;
        }

        /* 
        *   تأثير الابتسامة
        */
        .mouth {
            background-color: black;
        }

        /* 
        *   لون العينين
        */
        .eyes .eye {
            background-color: blue;
        }

        /* 
        *   لون الويسكي
        */
        .whiskey {
            background-color: #FFD700;
        }

        /* 
        *   لون العلبة
        */
        .bottle {
            background-color: #FF0000;
        }

        /* 
        *   لون الذراعين
        */
        .arms .arm {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid black;
            box-shadow: 0 0 10px black;
        }

        /* 
        *   لون القدمين
        */
        .legs .leg {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid black;
            box-shadow: 0 0 10px black;
        }

        /* 
        *   تأثير الذراعين والقدمين
        */
        .arms .arm {
            transition: transform 1s;
        }
        .legs .leg {
            transition: transform 1s;
        }
    </style>
    <script>
        // تأثير الابتسامة
        function animateMouth() {
            var mouth = document.querySelector('.mouth');
            mouth.style.width = '50px';
            mouth.style.height = '20px';
            setTimeout(function() {
                mouth.style.width = '20px';
                mouth.style.height = '50px';
            }, 1000);
            setTimeout(animateMouth, 2000);
        }

        // تأثير الذراعين
        function animateArms() {
            var armLeft = document.querySelector('.arm.left');
            var armRight = document.querySelector('.arm.right');
            armLeft.style.transform = 'rotate(45deg)';
            armRight.style.transform = 'rotate(-45deg)';
            setTimeout(function() {
                armLeft.style.transform = 'rotate(-45deg)';
                armRight.style.transform = 'rotate(45deg)';
            }, 1000);
            setTimeout(animateArms, 2000);
        }

        // تأثير القدمين
        function animateLegs() {
            var legLeft = document.querySelector('.leg.left');
            var legRight = document.querySelector('.leg.right');
            legLeft.style.transform = 'rotate(45deg)';
            legRight.style.transform = 'rotate(-45deg)';
            setTimeout(function() {
                legLeft.style.transform = 'rotate(-45deg)';
                legRight.style.transform = 'rotate(45deg)';
            }, 1000);
            setTimeout(animateLegs, 2000);
        }

        animateMouth();
        animateArms();
        animateLegs();
    </script>
</head>
<body>
    <div class="character">
        <img src="character.png">
        <div class="eyes">
            <div class="eye left-eye"></div>
            <div class="eye right-eye"></div>
        </div>
        <div class="mouth"></div>
        <div class="whiskey"></div>
        <div class="bottle"></div>
        <div class="arms">
            <div class="arm left"></div>
            <div class="arm right"></div>
        </div>
        <div class="legs">
            <div class="leg left"></div>
            <div class="leg right"></div>
        </div>
    </div>
</body>
</html>
