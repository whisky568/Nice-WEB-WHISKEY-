<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر المنتجات</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }
        header {
            background-color: #333;
            color: #fff;
            padding: 20px;
            text-align: center;
        }
        header h1 {
            margin: 0;
        }
        nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: space-between;
        }
        nav li {
            margin-right: 20px;
        }
        nav a {
            color: #fff;
            text-decoration: none;
        }
        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        section {
            background-color: #fff;
            padding: 20px;
            border: 1px solid #ddd;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .products {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }
        .product {
            margin: 20px;
            width: calc(33.33% - 20px);
        }
        .product img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 10px;
        }
        .product h3 {
            font-weight: bold;
            margin-top: 10px;
        }
        button {
            background-color: #333;
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #555;
        }
        footer {
            background-color: #333;
            color: #fff;
            padding: 10px;
            text-align: center;
            clear: both;
        }
    </style>
</head>
<body>
    <header>
        <h1>متجر المنتجات</h1>
        <nav>
            <ul>
                <li><a href="#">الصفحة الرئيسية</a></li>
                <li><a href="#">منتجات</a></li>
                <li><a href="#">عن нас</a></li>
                <li><a href="#">تواصل معنا</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section>
            <h2>منتجاتنا</h2>
            <div class="products">
                <div class="product">
                    <img src="product1.jpg" alt="منتج 1">
                    <h3>منتج 1</h3>
                    <p>وصف المنتج 1</p>
                    <button>شراء</button>
                </div>
                <div class="product">
                    <img src="product2.jpg" alt="منتج 2">
                    <h3>منتج 2</h3>
                    <p>وصف المنتج 2</p>
                    <button>شراء</button>
                </div>
                <div class="product">
                    <img src="product3.jpg" alt="منتج 3">
                    <h3>منتج 3</h3>
                    <p>وصف المنتج 3</p>
                    <button>شراء</button>
                </div>
            </div>
        </section>
        <footer>
            <p>&copy; 2023 متجر المنتجات</p>
        </footer>
    </main>
</body>
</html>
